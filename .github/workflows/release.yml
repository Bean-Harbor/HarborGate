name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release"
        required: true
        default: "1.0.0"

jobs:
  build-deb:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 45

    steps:
      - name: Checkout HarborGate
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: |
          rustup target add x86_64-unknown-linux-gnu

      - name: Cache cargo builds
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --locked --release --bin harboros-im-gate --target x86_64-unknown-linux-gnu

      - name: Create deb package
        run: |
          VERSION="${{ inputs.tag }}"
          bash ./debian/build-amd64-package \
            "$VERSION" \
            ./target/x86_64-unknown-linux-gnu/release/harboros-im-gate \
            ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.tag }}
          name: v${{ inputs.tag }}
          generate_release_notes: true
          files: |
            ./artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
