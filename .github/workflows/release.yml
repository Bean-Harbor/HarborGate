name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing source tag version without the v prefix (for example 1.0.0)
        required: true

permissions:
  contents: write

env:
  BUILD_CONTAINER_DIGEST: sha256:a339861ae23e9abb272cea45dfafde21760d2ce6577a70f8a926153677902663
  DEBIAN_SNAPSHOT: 20260801T000000Z
  DEBIAN_VERSION: ${{ inputs.tag }}

jobs:
  build-audited-deb:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: rust:1.96.1-bookworm@sha256:a339861ae23e9abb272cea45dfafde21760d2ce6577a70f8a926153677902663
    steps:
      - name: Checkout the exact release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: refs/tags/v${{ inputs.tag }}

      - name: Trust the checked-out container workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify tag and source commit
        run: |
          test "$(git rev-list -n 1 "refs/tags/v${DEBIAN_VERSION}")" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain --untracked-files=normal)"
          dpkg --validate-version "$DEBIAN_VERSION"

      - name: Install snapshot-pinned packaging tools
        env:
          HARBORGATE_DEBIAN_SNAPSHOT: ${{ env.DEBIAN_SNAPSHOT }}
        run: |
          bash scripts/configure_debian_snapshot.sh
          apt-get update
          apt-get install --yes --no-install-recommends dpkg-dev init-system-helpers iproute2 python3 python3-pytest xz-utils
          rustup target add x86_64-unknown-linux-gnu

      - name: Build, compare, and exercise the audited package
        env:
          DEB_ARCH: amd64
          RUST_TARGET: x86_64-unknown-linux-gnu
          HARBORGATE_BUILD_CONTAINER_DIGEST: ${{ env.BUILD_CONTAINER_DIGEST }}
          HARBORGATE_DEBIAN_SNAPSHOT: ${{ env.DEBIAN_SNAPSHOT }}
        run: |
          export SOURCE_COMMIT="$(git rev-parse HEAD)"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python3 -m pytest scripts/tests/test_supply_chain_scripts.py -q
          bash scripts/verify_k3_reproducible.sh
          bash scripts/build_harborgate_k3_deb.sh
          (cd dist/harborgate-debs && sha256sum --check ./*.sha256)
          python3 scripts/verify_release_bundle.py dist/harborgate-debs \
            --arch amd64 --version "$DEBIAN_VERSION" \
            --require-release-eligible
          bash scripts/test_deb_lifecycle.sh dist/harborgate-debs/*.deb

      - name: Create release from the verified tag
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: v${{ inputs.tag }}
          name: v${{ inputs.tag }}
          generate_release_notes: true
          files: dist/harborgate-debs/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
